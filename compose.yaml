name: scanned-drawings-to-cad

x-app: &app
  image: scanned-drawings-to-cad:local
  pull_policy: never
  platform: linux/amd64
  init: true
  restart: unless-stopped
  environment: &environment
    CAD_SERVICE_DSN: postgresql://cad_demo:cad_local@db:5432/cad_recovery
    CAD_SERVICE_TIMEOUT_SECONDS: ${CAD_SERVICE_TIMEOUT_SECONDS:-900}
  volumes:
    - documents:/app/artifacts/profile-service-v1
  stop_grace_period: 30s
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cad_demo
      POSTGRES_PASSWORD: cad_local
      POSTGRES_DB: cad_recovery
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cad_demo -d cad_recovery"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s

  setup:
    <<: *app
    command: [init]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    build: .
    command: [web]
    environment:
      <<: *environment
      CAD_DOCKER_LOCAL_OPERATOR: "1"
    ports:
      - "127.0.0.1:${CAD_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5

  worker:
    <<: *app
    command: [worker]
    mem_limit: 4g

  corrections:
    <<: *app
    command: [corrections]
    mem_limit: 4g

  tables:
    <<: *app
    command: [tables]
    mem_limit: 4g

volumes:
  database:
  documents:
